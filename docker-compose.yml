services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: delivery_optimizer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./services/api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/delivery_optimizer
      SECRET_KEY: dev-secret-key-change-in-production
      CORS_ORIGINS: http://localhost:3000
      OSRM_BASE_URL: https://router.project-osrm.org
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./services/api:/app

  web:
    build: ./apps/web
    command: corepack pnpm dev
    ports:
      - "3000:3000"
    environment:
      # a chamada sai do navegador do usuário, por isso localhost e não "api"
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules

volumes:
  postgres_data:
  web_node_modules:
